[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes-workflows"
version = "0.1.0"
description = "Workflow tooling for durable work context"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "pyyaml>=6.0",
]

[project.scripts]
work-yaml = "notes_workflows.work_yaml:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/notes_workflows"]
